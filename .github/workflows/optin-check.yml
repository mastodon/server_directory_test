---
name: Opt-in check
on:
  push:

jobs:
  Schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dump GitHub context
        id: getfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | grep '^default_servers/' | xargs -I {} basename {} .yaml | xargs)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: echo output
        run: |
          echo ${{ steps.getfile.outputs.files }}
