---
name: Push Check schema
on:
  push:
    paths:
      - 'servers/*'
      - 'default_servers/*'

jobs:
  Schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Run Check-jsonschema
        run: check-jsonschema --schemafile .schema.yml servers/*

      - name: Run Check-json-dsr-schema
        run: check-jsonschema --schemafile .dsr_schema.yml default_servers/*
  Lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Lint yaml files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: servers/*
          format: github
      - name: Lint yaml files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: default_servers/*
          format: github
