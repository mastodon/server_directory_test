---
name: Cleanup Inactive Server Files
on:
  push:
  # schedule:
  #   - cron: '0 6 * * *' # Every day
  # workflow_dispatch:
  #  for domain in `curl http://127.0.0.1:3000/active-servers/ | tr '[",]' \ `; do echo $domain; done
permissions:
  contents: write
  pull-requests: write

env:
  TEST_FILE_PATH: ./servers/server.something.yml

          # echo "server_paths=$(gh repo read-dir servers --repo mastodon/server_directory_test --json name,path --jq '.["entries"]')" >> $GITHUB_OUTPUT
          # echo $server_paths
jobs:
  cleanup-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read filenames in server dir
        id: file_path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "server_domains=$(gh repo read-dir servers --repo mastodon/server_directory_test --json name | jq -r '.["entries"] | .[] | .name' | xargs -I {} basename {} .yml | xargs -I {} basename {} .yaml | xargs)" >> $GITHUB_OUTPUT
          echo $server_domains

      # - name: echo server-paths
      #   run: echo "${{ steps.file_path.outputs.server_paths }}"
      - name: echo server-domains
        run: echo "${{ steps.file_path.outputs.server_domains }}"
      - name: Request active server files
        # filter out which items from the second list are missing from the base list
        run: |
          FILES="add.more.languages allows.all.languages catland.social test.com european.server for.testing loony.tunes mastodon.social mstdn.srvr other.server server.something test.server"
          MISSING=$(grep -vxf <(echo "$domains" | tr ' ' '\n') <(echo "$FILES" | tr ' ' '\n') || true)
          if [ -z "$MISSING" ]; then
            echo "all elements from server domains are in FILES"
          else
            MISSING_SPACE=$(echo "$MISSING" | tr '\n' ' ')
            echo "missing elements $MISSING_SPACE"
          fi
        shell: bash
      - name: Remove Test file
        run: |
          if [ -f ${{ env.TEST_FILE_PATH }} ]; then
            rm ${{ env.TEST_FILE_PATH }}
            echo "Test file removed."
          else
            echo "Test file not found."
            exit  1
          fi
        shell: bash
      # Create or update the pull request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Remove inactive server files
          title: Cleanup Server Files (automated)
          author: GitHub Actions <noreply@github.com>
          body: Remove inactive server files, automated with GitHub Actions
          branch: cleanup-servers
          base: main
